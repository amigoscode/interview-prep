spring.application.name=constraints-and-races

# Postgres from compose.yaml. Port 5449 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5449/app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# schema.sql is run on every start. It drops the tables and creates them again, so the database
# always has exactly the constraints that are written in that file.
spring.sql.init.mode=always

# How long the work between a check and an insert takes, in milliseconds (hashing the password,
# charging the card).
app.work-millis=100

# Uncomment to see every SQL statement (or run ./demo --sql).
# logging.level.org.hibernate.SQL=DEBUG
