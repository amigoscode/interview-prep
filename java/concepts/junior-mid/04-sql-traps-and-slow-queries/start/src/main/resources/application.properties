spring.application.name=sqltraps

# Postgres from compose.yaml. Port 5447 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5447/sqltraps}
spring.datasource.username=${DB_USER:sqltraps}
spring.datasource.password=${DB_PASSWORD:sqltraps}

# The tables and the rows are set up at startup by DatabaseSetup (see db/).
# small = 8 customers and 12 orders, written out by hand (seed-small.sql).
# big   = the small shop plus 300,000 generated orders (seed-big.sql).
spring.sql.init.mode=never
shop.seed=big
