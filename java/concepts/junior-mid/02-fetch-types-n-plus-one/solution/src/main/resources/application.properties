spring.application.name=fetching

# Postgres from compose.yaml. Port 5443 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5443/fetching}
spring.datasource.username=${DB_USER:fetching}
spring.datasource.password=${DB_PASSWORD:fetching}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# The Hibernate session ends when the transaction ends. Leave this off: see Task 3.
spring.jpa.open-in-view=false

# Counts every SQL statement Hibernate sends. The demo, inspect and the tests read the count.
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.amigoscode.fetching.sql.SqlRecorder

# Uncomment to see every SQL statement (or run ./demo --sql).
# logging.level.org.hibernate.SQL=DEBUG
