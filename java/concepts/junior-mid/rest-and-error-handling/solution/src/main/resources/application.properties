spring.application.name=rest-and-error-handling

# Postgres from compose.yaml. Port 5446 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5446/orders}
spring.datasource.username=${DB_USER:orders}
spring.datasource.password=${DB_PASSWORD:orders}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
