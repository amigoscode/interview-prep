spring.application.name=transactional

# Postgres from compose.yaml. Port 5442 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5442/bank}
spring.datasource.username=${DB_USER:bank}
spring.datasource.password=${DB_PASSWORD:bank}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Uncomment to see every SQL statement (or run ./demo --sql).
# logging.level.org.hibernate.SQL=DEBUG
