# "name" keeps this project's container apart from the other concept projects. Without it Docker
# Compose names the project after the folder ("start" or "solution"), which every project shares.
name: transactional

services:
  postgres:
    image: postgres:17-alpine
    container_name: transactional-postgres
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 2s
      timeout: 2s
      retries: 20
