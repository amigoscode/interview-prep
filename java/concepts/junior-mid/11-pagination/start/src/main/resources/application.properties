spring.application.name=pagination

# Postgres from compose.yaml. Port 5450 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5450/pagination}
spring.datasource.username=${DB_USER:pagination}
spring.datasource.password=${DB_PASSWORD:pagination}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# The table, the rows and the indexes are set up at startup by DatabaseSetup (see db/).
# It runs schema.sql, seeds this many orders with generate_series, then applies indexes.sql.
spring.sql.init.mode=never
shop.seed.orders=1000000

# Uncomment to see every SQL statement. (./demo and ./inspect already print the SQL of each request.)
# logging.level.org.hibernate.SQL=DEBUG
