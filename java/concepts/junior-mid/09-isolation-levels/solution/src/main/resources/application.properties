spring.application.name=isolation-levels

# Postgres from compose.yaml. Port 5448 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5448/bank}
spring.datasource.username=${DB_USER:bank}
spring.datasource.password=${DB_PASSWORD:bank}
# The name ./inspect shows for the application's database sessions.
spring.datasource.hikari.data-source-properties.ApplicationName=bank-app

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.main.web-application-type=none

# Uncomment to see every SQL statement Hibernate sends.
# logging.level.org.hibernate.SQL=DEBUG
