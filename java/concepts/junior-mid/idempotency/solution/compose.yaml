# The project name keeps this container apart from the other concept projects, which also have
# a start/ and a solution/ folder. start/ and solution/ share this one database.
name: idempotency

services:
  postgres:
    image: postgres:17-alpine
    container_name: idempotency-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 2s
      retries: 20
