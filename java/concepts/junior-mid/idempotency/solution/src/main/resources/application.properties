spring.application.name=idempotency

# Postgres from compose.yaml. Port 5444 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5444/payments}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:payments}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# schema.sql drops and recreates the tables every time the application starts.
spring.sql.init.mode=always

# How long the card processor takes, in milliseconds. It runs between the key check and the charge.
payments.processor-millis=100
# The demo uses this to make the very first call slow, so the client times out. -1 = not slower.
payments.processor-first-call-millis=-1

# Uncomment to see every SQL statement (or run ./demo --sql).
# logging.level.org.hibernate.SQL=DEBUG
