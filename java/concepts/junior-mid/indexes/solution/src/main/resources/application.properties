spring.application.name=indexes

# Postgres from compose.yaml. Port 5441 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5441/indexes}
spring.datasource.username=${DB_USER:indexes}
spring.datasource.password=${DB_PASSWORD:indexes}

# The tables, the rows and the indexes are set up at startup by DatabaseSetup (see db/).
# It runs schema.sql, seeds this many orders with generate_series, then applies indexes.sql.
spring.sql.init.mode=never
shop.seed.orders=1000000
