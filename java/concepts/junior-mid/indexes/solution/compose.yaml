# The project name is set here because the folder is called "solution" (or "start") in every
# project of this repository: without it, "docker compose down" in another project would stop this one.
name: indexes
services:
  postgres:
    image: postgres:17-alpine
    container_name: indexes-postgres
    environment:
      POSTGRES_DB: indexes
      POSTGRES_USER: indexes
      POSTGRES_PASSWORD: indexes
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexes -d indexes"]
      interval: 2s
      timeout: 2s
      retries: 20
