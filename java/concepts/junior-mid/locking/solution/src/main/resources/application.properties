spring.application.name=locking

# Postgres from compose.yaml. Port 5440 so it does not clash with a Postgres you already run.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD:shop}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# How long the fraud check takes, in milliseconds. It runs between reading the stock and writing it.
shop.fraud-check-millis=100

# Uncomment to see every SQL statement (or run ./demo --sql).
# logging.level.org.hibernate.SQL=DEBUG
