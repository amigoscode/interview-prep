spring:
  application:
    name: secret-storage

server:
  port: 8080

app:
  admin:
    # Not a secret: configuration, and safe to commit.
    username: admin
    # A bcrypt hash of the password, never the password itself. Supplied by the environment
    # the app runs in and never committed. Empty here so startup fails with a clear message.
    password-hash: ${ADMIN_PASSWORD_HASH:}
